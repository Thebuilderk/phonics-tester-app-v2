<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANA Phonics Tester</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="assets/sun_logo.png" alt="LANA Logo" class="logo">
            <div class="avatar-customizer">
                <img src="assets/avatar_fox.png" alt="Avatar Fox" class="avatar-example">
                <img src="assets/avatar_owl.png" alt="Avatar Owl" class="avatar-example">
                <img src="assets/avatar_robot.png" alt="Avatar Robot" class="avatar-example">
                <button class="customize-button">CUSTOMIZE</button>
            </div>
        </header>

        <main class="main-content">
            <section class="learn-section">
                <h2>LEARN</h2>
                <div class="learn-options">
                    <div class="option-card roadmap">
                        <img src="assets/treehouse_phase2.png" alt="Phase 2" class="phase-icon">
                        <img src="assets/rocket_phase5.png" alt="Phase 5" class="phase-icon">
                        <span>Roadmap</span>
                    </div>
                    <div class="option-card">
                        <img src="assets/icon_progress.png" alt="Progress" class="option-icon">
                        <span>PROGRESS</span>
                    </div>
                    <div class="option-card">
                        <img src="assets/icon_gems.png" alt="Gems" class="option-icon">
                        <span>GEMS</span>
                    </div>
                    <div class="option-card">
                        <img src="assets/icon_rewards.png" alt="Rewards" class="option-icon">
                        <span>REWARDS</span>
                    </div>
                </div>
            </section>

            <section class="test-section">
                <h2>TEST</h2>
                <div class="test-area">
                    <p class="test-word">cat</p>
                    <p class="score">0/40</p>
                    <img src="assets/zorgo_mascot.png" alt="Zorgo Mascot" class="zorgo-mascot">
                    <p class="encouragement">START TEST</p>
                    <button class="start-test-button">START TEST</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item">
                <img src="assets/icon.png" alt="Home">
                <span>HOME</span>
            </a>
            <a href="#" class="nav-item">
                <img src="assets/nav_games.png" alt="Games">
                <span>GAMES</span>
            </a>
            <a href="#" class="nav-item">
                <img src="assets/nav_stories.png" alt="Stories">
                <span>STORIES</span>
            </a>
            <a href="#" class="nav-item">
                <img src="assets/nav_stuff.png" alt="My Stuff">
                <span>MY STUFF</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
